[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wavekit"
version = "0.1.0"
description = "Elliott wave analysis toolkit with an LLM information layer"
requires-python = ">=3.9"
dependencies = ["pandas>=2.0", "numpy>=1.24", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
